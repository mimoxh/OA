<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>协作平台 OA</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f5;
        --card: #ffffff;
        --ink: #37352f;
        --ink-2: #6b6a65;
        --ink-3: #9b9a97;
        --line: #e9e9e7;
        --line-strong: #d9d9d6;
        --hover: rgba(55, 53, 47, 0.06);
        --brand: #2383e2;
        --brand-hover: #1b6fc4;
        --brand-soft: #e8f1fb;
        --ok: #10b981;
        --warn: #f59e0b;
        --danger: #e03e3e;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        user-select: none;
        overflow: hidden;
      }
      button { font: inherit; color: inherit; }
      input { font: inherit; user-select: text; }

      /* 标题栏 */
      .titlebar { height: 40px; flex: none; display: flex; align-items: center; padding-left: 14px; gap: 8px; }
      .titlebar .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; pointer-events: none; }
      .titlebar .name { font-size: 12px; color: var(--ink-2); pointer-events: none; }
      .titlebar .spacer { flex: 1; align-self: stretch; }
      .controls { display: flex; align-self: stretch; }
      .controls button { width: 46px; border: 0; background: transparent; color: var(--ink-2); display: grid; place-items: center; cursor: default; }
      .controls button:hover { background: rgba(0, 0, 0, 0.06); color: var(--ink); }
      .controls button.close:hover { background: #c42b1c; color: #fff; }

      main { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 32px 24px 40px; }
      .view { width: 100%; max-width: 640px; display: none; margin: auto 0; }
      .view.active { display: block; }
      .narrow { max-width: 440px; }

      h1 { font-size: 22px; margin: 0 0 6px; font-weight: 700; }
      h2 { font-size: 17px; margin: 0; font-weight: 600; }
      .lead { margin: 0 0 24px; color: var(--ink-2); }
      .center { text-align: center; }
      .logo { width: 48px; height: 48px; margin: 0 auto 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 20px; font-weight: 700; display: grid; place-items: center; }

      .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .choice { position: relative; text-align: left; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s; }
      .choice:hover { border-color: var(--brand); box-shadow: 0 6px 20px rgba(35, 131, 226, 0.1); }
      .choice .icon { width: 36px; height: 36px; border-radius: 9px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; margin-bottom: 14px; }
      .choice h3 { margin: 0 0 6px; font-size: 15px; }
      .choice p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
      .badge { position: absolute; top: 14px; right: 14px; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }

      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
      .card + .card { margin-top: 12px; }
      .head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .back { border: 0; background: transparent; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); cursor: pointer; }
      .back:hover { background: var(--hover); color: var(--ink); }

      .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
      .row:first-child { border-top: 0; padding-top: 0; }
      .row:last-child { padding-bottom: 0; }
      .row .label { font-weight: 600; }
      .row .hint { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
      label.field { display: block; font-size: 12px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
      .input { width: 100%; height: 36px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); outline: none; }
      .input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(35, 131, 226, 0.15); }
      .input.port { width: 110px; text-align: center; }

      .switch { position: relative; width: 36px; height: 20px; flex: none; }
      .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
      .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-strong); transition: background 0.15s; pointer-events: none; }
      .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: transform 0.15s; }
      .switch input:checked + span { background: var(--brand); }
      .switch input:checked + span::after { transform: translateX(16px); }

      .btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
      .btn:hover { background: #f4f4f2; }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
      .btn.primary:hover { background: var(--brand-hover); }
      .btn:disabled { opacity: 0.55; cursor: default; pointer-events: none; }
      .btn.block { width: 100%; height: 38px; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
      .link { border: 0; background: none; color: var(--brand); cursor: pointer; padding: 0; }
      .link:hover { text-decoration: underline; }

      .status { display: flex; align-items: center; gap: 10px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
      .dot.running { background: var(--ok); }
      .dot.starting { background: var(--warn); animation: pulse 1s infinite; }
      .dot.error { background: var(--danger); }
      @keyframes pulse { 50% { opacity: 0.35; } }
      .error-box { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: #fdecec; color: #a12b2b; font-size: 12px; white-space: pre-wrap; word-break: break-all; user-select: text; }
      .msg { min-height: 20px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
      .msg.error { color: var(--danger); }

      .addr { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; background: var(--bg); margin-top: 6px; }
      .addr code { flex: 1; font: 12.5px Consolas, monospace; user-select: text; }
      .addr small { color: var(--ink-3); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .addr button { border: 0; background: none; color: var(--brand); cursor: pointer; font-size: 12px; }
      .path { font: 12px Consolas, monospace; color: var(--ink-2); word-break: break-all; user-select: text; }
      .move { margin-top: 4px; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
      .move .path { margin: 2px 0 6px; color: var(--ink); }
      .radio { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; }
      .radio input { margin: 3px 0 0; }
      .radio b { color: var(--ink); font-weight: 600; }

      .recent { margin-top: 16px; }
      .recent-title { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
      .recent-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
      .recent-item:hover { background: var(--hover); }
      .recent-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .recent-item button { border: 0; background: none; color: var(--ink-3); cursor: pointer; width: 22px; height: 22px; border-radius: 5px; }
      .recent-item button:hover { background: rgba(0, 0, 0, 0.08); color: var(--ink); }

      .spinner { width: 34px; height: 34px; margin: 0 auto 18px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .footer { margin-top: 28px; text-align: center; color: var(--ink-3); font-size: 11.5px; }
    </style>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <div class="mark">协</div>
      <div class="name">协作平台 OA</div>
      <div class="spacer" data-tauri-drag-region></div>
      <div class="controls">
        <button data-action="minimize" title="最小化" aria-label="最小化">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5.5h10" stroke="currentColor" /></svg>
        </button>
        <button data-action="toggle_maximize" id="max-btn" title="最大化" aria-label="最大化">
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="1" stroke="currentColor" /></svg>
        </button>
        <button data-action="close" class="close" title="关闭" aria-label="关闭">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" /></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- 选择工作空间 -->
      <section class="view" id="view-home">
        <div class="center">
          <div class="logo">协</div>
          <h1>欢迎使用协作平台 OA</h1>
          <p class="lead">选择这台电脑的使用方式，之后可以随时在「服务器与工作空间设置」中切换</p>
        </div>
        <div class="choices">
          <button class="choice" id="choose-server">
            <span class="badge" id="badge-server" hidden>当前</span>
            <div class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="8" rx="2" /><rect x="2" y="13" width="20" height="8" rx="2" /><path d="M6 7h.01M6 17h.01" /></svg>
            </div>
            <h3>在本机创建工作空间</h3>
            <p>这台电脑作为服务器，数据保存在本机。同事在同一局域网内用客户端或浏览器访问。</p>
          </button>
          <button class="choice" id="choose-client">
            <span class="badge" id="badge-client" hidden>当前</span>
            <div class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
            </div>
            <h3>连接已有服务器</h3>
            <p>公司已经部署了工作空间，或同事的电脑正在托管，输入地址即可加入。</p>
          </button>
        </div>
        <div class="actions" id="home-resume" hidden style="justify-content: center; margin-top: 22px">
          <button class="btn primary" id="resume-btn">返回工作空间</button>
        </div>
      </section>

      <!-- 本机服务器 -->
      <section class="view" id="view-server">
        <div class="head">
          <button class="back" data-go="home" title="返回" aria-label="返回">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
          </button>
          <h2>本机服务器</h2>
        </div>

        <div class="card">
          <div class="status">
            <span class="dot" id="srv-dot"></span>
            <div style="flex: 1">
              <div class="label" id="srv-status">未启动</div>
              <div class="hint" id="srv-hint"></div>
            </div>
            <button class="btn primary" id="enter-btn" disabled>进入工作空间</button>
          </div>
          <div class="error-box" id="srv-error" hidden></div>
          <div id="srv-addrs"></div>
        </div>

        <div class="card">
          <div class="row">
            <div>
              <div class="label">允许局域网访问</div>
              <div class="hint">关闭后只有本机可以使用；开启后同事可通过下方地址访问</div>
            </div>
            <label class="switch"><input type="checkbox" id="lan-input" /><span></span></label>
          </div>
          <div class="row">
            <div>
              <div class="label">端口</div>
              <div class="hint">默认 17300，被占用时可更换</div>
            </div>
            <input class="input port" id="port-input" type="number" min="1024" max="65535" />
          </div>
          <div class="row">
            <div>
              <div class="label">Windows 防火墙</div>
              <div class="hint">同事无法访问时，添加入站放行规则（需要管理员授权）</div>
            </div>
            <button class="btn" id="firewall-btn">添加放行规则</button>
          </div>
          <div class="row">
            <div style="min-width: 0">
              <div class="label">数据目录</div>
              <div class="hint">数据库、附件与备份都保存在这里，建议放在空间充足、定期备份的磁盘</div>
              <div class="path" id="data-dir"></div>
              <button class="link" id="data-reset" hidden style="font-size: 12px; margin-top: 4px">恢复默认位置</button>
            </div>
            <div style="display: flex; gap: 8px">
              <button class="btn" id="data-change">更改…</button>
              <button class="btn" id="data-btn">打开</button>
            </div>
          </div>
          <div class="move" id="move-panel" hidden>
            <div class="label">更换到</div>
            <div class="path" id="move-path"></div>
            <div class="hint" id="move-note"></div>
            <div id="move-options">
              <label class="radio"><input type="radio" name="move-mode" value="migrate" checked /><span><b>迁移现有数据</b>　把当前的数据库、附件和备份复制过去，原目录保留，确认无误后可手动删除</span></label>
              <label class="radio"><input type="radio" name="move-mode" value="fresh" /><span><b>使用空的新工作空间</b>　新位置从头开始，需要重新创建管理员；当前数据保留在原位置</span></label>
            </div>
            <div class="actions" style="margin-top: 12px">
              <button class="btn" id="move-cancel">取消</button>
              <button class="btn primary" id="move-confirm">确认更换</button>
            </div>
          </div>
          <div class="msg" id="srv-msg"></div>
          <div class="actions">
            <button class="btn primary" id="apply-btn">启动服务</button>
          </div>
        </div>
      </section>

      <!-- 连接服务器 -->
      <section class="view narrow" id="view-connect">
        <div class="head">
          <button class="back" data-go="home" title="返回" aria-label="返回">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6" /></svg>
          </button>
          <h2>连接已有服务器</h2>
        </div>
        <form class="card" id="connect-form">
          <label class="field" for="url-input">服务器地址</label>
          <input class="input" id="url-input" placeholder="例如 192.168.1.20:17300 或 https://oa.example.com" autocomplete="off" spellcheck="false" />
          <div class="msg" id="connect-msg"></div>
          <button class="btn primary block" id="connect-btn" type="submit">连接</button>
          <div class="recent" id="recent" hidden>
            <div class="recent-title">最近连接</div>
            <div id="recent-list"></div>
          </div>
        </form>
      </section>

      <!-- 启动中 / 连接中 -->
      <section class="view narrow center" id="view-progress">
        <div class="spinner"></div>
        <h2 id="progress-title">正在启动本机服务…</h2>
        <p class="lead" id="progress-hint" style="margin-top: 6px">首次启动需要初始化数据库，请稍候</p>
        <button class="link" id="progress-cancel">服务器设置</button>
      </section>
    </main>

    <script>
      const invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);
      const $ = (id) => document.getElementById(id);
      const MAX_ICON = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" rx="1" stroke="currentColor" /></svg>';
      const RESTORE_ICON = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="2.5" width="7" height="7" rx="1" stroke="currentColor" /><path d="M2.5 2.5V1.5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-1" stroke="currentColor" /></svg>';

      let state = null;
      let pollTimer = null;
      let autoEnter = false;

      // ── 窗口按钮 ──
      document.querySelectorAll(".controls button").forEach((b) => {
        b.addEventListener("click", () => invoke("window_action", { action: b.dataset.action }));
      });
      async function syncMaximized() {
        const max = await invoke("window_is_maximized").catch(() => false);
        const btn = $("max-btn");
        btn.innerHTML = max ? RESTORE_ICON : MAX_ICON;
        btn.title = max ? "向下还原" : "最大化";
      }
      window.addEventListener("resize", syncMaximized);

      // ── 视图切换 ──
      function show(view) {
        document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + view));
        if (view === "server") startPolling();
        else if (view !== "progress") stopPolling();
        if (view === "home") renderHome();
        if (view === "connect") renderConnect();
      }
      document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => show(b.dataset.go)));

      function hostOf(url) {
        try { return new URL(url).host; } catch { return url; }
      }

      // ── 首页 ──
      function renderHome() {
        $("badge-server").hidden = state.mode !== "server";
        $("badge-client").hidden = state.mode !== "client";
        const canResume = (state.mode === "server" && state.server.status === "running") || (state.mode === "client" && state.serverUrl);
        $("home-resume").hidden = !canResume;
      }
      $("choose-server").addEventListener("click", () => show("server"));
      $("choose-client").addEventListener("click", () => show("connect"));
      $("resume-btn").addEventListener("click", () => {
        if (state.mode === "server") invoke("enter_server").catch(() => show("server"));
        else connect(state.serverUrl);
      });

      // ── 本机服务器 ──
      const STATUS_TEXT = { stopped: "未启动", starting: "正在启动…", running: "运行中", error: "启动失败" };

      function renderServer() {
        const s = state.server;
        const isServerMode = state.mode === "server";
        $("srv-dot").className = "dot " + s.status;
        $("srv-status").textContent = STATUS_TEXT[s.status] || s.status;
        $("srv-hint").textContent =
          s.status === "running" ? (s.lan ? "本机与局域网内的同事均可访问" : "仅本机可访问") + " · 端口 " + s.port
          : s.status !== "stopped" ? ""
          : state.mode === "client" ? "当前为「连接已有服务器」模式，启动后将切换为本机服务器"
          : !isServerMode ? "启动后这台电脑将作为工作空间服务器" : "";
        $("enter-btn").disabled = s.status !== "running";
        $("srv-error").hidden = !s.error;
        $("srv-error").textContent = s.error || "";

        const box = $("srv-addrs");
        box.innerHTML = "";
        if (s.status === "running" && s.lan) {
          if (s.addresses.length === 0) {
            box.innerHTML = '<div class="hint" style="margin-top:12px">未检测到局域网地址，请确认已连接网络</div>';
          } else {
            const title = document.createElement("div");
            title.className = "hint";
            title.style.marginTop = "14px";
            title.textContent = "同事可在客户端或浏览器中输入以下地址访问";
            box.appendChild(title);
            for (const a of s.addresses) {
              const row = document.createElement("div");
              row.className = "addr";
              row.innerHTML = "<code></code><small></small><button>复制</button>";
              row.querySelector("code").textContent = a.url;
              row.querySelector("small").textContent = a.name;
              row.querySelector("button").addEventListener("click", async (e) => {
                await navigator.clipboard.writeText(a.url).catch(() => {});
                e.target.textContent = "已复制";
                setTimeout(() => (e.target.textContent = "复制"), 1500);
              });
              box.appendChild(row);
            }
          }
        }

        const running = s.status === "running" || s.status === "starting";
        const dirty = running && (Number($("port-input").value) !== s.port || $("lan-input").checked !== s.lan);
        const btn = $("apply-btn");
        btn.textContent = !running ? "启动服务" : dirty ? "保存并重启服务" : "重启服务";
      }

      function fillServerForm() {
        $("port-input").value = state.port;
        $("lan-input").checked = state.lan;
        renderDataDir();
      }

      // ── 数据目录 ──
      let pendingDir = null;

      function renderDataDir() {
        $("data-dir").textContent = state.dataDir;
        $("data-reset").hidden = state.dataDir.toLowerCase() === state.defaultDataDir.toLowerCase() || !!pendingDir;
        $("move-panel").hidden = !pendingDir;
        if (!pendingDir) return;
        $("move-path").textContent = pendingDir.path;
        $("move-options").hidden = !canMigrate(pendingDir);
        const notes = [];
        if (pendingDir.subfolder) notes.push("所选文件夹中已有其他文件，将在其中新建 OA-Workspace 文件夹存放数据");
        if (pendingDir.hasWorkspace) notes.push("该位置已有工作空间数据，将直接使用它；当前数据保留在原位置");
        else if (!pendingDir.currentHasData) notes.push("当前位置还没有数据，之后的数据将直接保存到新位置");
        $("move-note").textContent = notes.join("。");
      }

      const canMigrate = (target) => !target.hasWorkspace && target.currentHasData;

      function setDataBusy(busy) {
        ["data-change", "data-reset", "move-confirm", "move-cancel", "apply-btn"].forEach((id) => ($(id).disabled = busy));
      }

      $("data-change").addEventListener("click", async () => {
        setMsg("srv-msg", "");
        try {
          const target = await invoke("pick_data_dir");
          if (!target) return;
          pendingDir = target;
          renderDataDir();
        } catch (e) {
          setMsg("srv-msg", String(e), true);
        }
      });

      $("data-reset").addEventListener("click", async () => {
        setMsg("srv-msg", "");
        try {
          pendingDir = await invoke("default_data_target");
          renderDataDir();
        } catch (e) {
          setMsg("srv-msg", String(e), true);
        }
      });

      $("move-cancel").addEventListener("click", () => {
        pendingDir = null;
        renderDataDir();
      });

      $("move-confirm").addEventListener("click", async () => {
        const migrate = canMigrate(pendingDir) && document.querySelector('input[name="move-mode"]:checked').value === "migrate";
        setDataBusy(true);
        setMsg("srv-msg", migrate ? "正在停止服务并迁移数据，数据量大时需要几分钟…" : "正在更换数据目录…");
        try {
          const res = await invoke("change_data_dir", { path: pendingDir.path, migrate });
          state.dataDir = res.dataDir;
          pendingDir = null;
          renderDataDir();
          $("srv-msg").className = "msg";
          $("srv-msg").innerHTML = "";
          if (res.oldDir) {
            const done = res.migrated ? "数据已迁移到新位置。原目录未删除，确认无误后可手动删除：" : "已更换数据目录。原目录未删除：";
            $("srv-msg").append(done + res.oldDir + "　");
            const open = document.createElement("button");
            open.className = "link";
            open.textContent = "打开原目录";
            open.addEventListener("click", () => invoke("open_data_dir", { path: res.oldDir }));
            $("srv-msg").append(open);
          } else {
            $("srv-msg").append("已更换数据目录");
          }
          await refreshServer();
        } catch (e) {
          setMsg("srv-msg", String(e), true);
        } finally {
          setDataBusy(false);
        }
      });
      ["port-input", "lan-input"].forEach((id) => $(id).addEventListener("input", renderServer));

      function setMsg(id, text, isError) {
        $(id).textContent = text || "";
        $(id).className = "msg" + (isError ? " error" : "");
      }

      $("apply-btn").addEventListener("click", async () => {
        const port = Number($("port-input").value);
        if (!Number.isInteger(port) || port < 1024 || port > 65535) {
          setMsg("srv-msg", "端口需为 1024–65535 之间的整数", true);
          return;
        }
        const lan = $("lan-input").checked;
        const s = state.server;
        const same = s.port === port && s.lan === lan && (s.status === "running" || s.status === "starting");
        setMsg("srv-msg", "");
        $("apply-btn").disabled = true;
        try {
          if (same) await invoke("restart_server");
          else await invoke("start_server", { port, lan });
          state.mode = "server";
          state.port = port;
          state.lan = lan;
          await refreshServer();
        } catch (e) {
          setMsg("srv-msg", String(e), true);
        } finally {
          $("apply-btn").disabled = false;
        }
      });

      $("enter-btn").addEventListener("click", () => invoke("enter_server").catch((e) => setMsg("srv-msg", String(e), true)));
      $("data-btn").addEventListener("click", () => invoke("open_data_dir"));
      $("firewall-btn").addEventListener("click", async () => {
        $("firewall-btn").disabled = true;
        setMsg("srv-msg", "请在弹出的系统授权窗口中确认…");
        try {
          await invoke("allow_firewall");
          setMsg("srv-msg", "已添加防火墙放行规则（端口 " + state.port + "，专用与域网络）");
        } catch (e) {
          setMsg("srv-msg", String(e), true);
        } finally {
          $("firewall-btn").disabled = false;
        }
      });

      async function refreshServer() {
        state.server = await invoke("server_status");
        renderServer();
        const progress = $("view-progress").classList.contains("active");
        if (autoEnter && state.server.status === "running") {
          autoEnter = false;
          stopPolling();
          invoke("enter_server").catch(() => show("server"));
        } else if (progress && state.server.status === "error") {
          autoEnter = false;
          show("server");
        }
      }
      function startPolling() {
        if (pollTimer) return;
        pollTimer = setInterval(() => refreshServer().catch(() => {}), 500);
      }
      function stopPolling() {
        clearInterval(pollTimer);
        pollTimer = null;
      }

      // ── 连接服务器 ──
      function normalizeUrl(raw) {
        let v = raw.trim().replace(/\/+$/, "");
        if (!v) return null;
        if (!/^https?:\/\//i.test(v)) v = "http://" + v;
        try {
          const u = new URL(v);
          return u.origin + u.pathname.replace(/\/+$/, "");
        } catch {
          return null;
        }
      }

      function renderConnect() {
        if (!$("url-input").value && state.serverUrl) $("url-input").value = state.serverUrl;
        const list = $("recent-list");
        list.innerHTML = "";
        $("recent").hidden = state.recentServers.length === 0;
        for (const url of state.recentServers) {
          const item = document.createElement("div");
          item.className = "recent-item";
          item.innerHTML = '<span></span><button type="button" title="移除">×</button>';
          item.querySelector("span").textContent = url;
          item.addEventListener("click", () => {
            $("url-input").value = url;
            connect(url);
          });
          item.querySelector("button").addEventListener("click", async (e) => {
            e.stopPropagation();
            await invoke("forget_server", { url });
            state.recentServers = state.recentServers.filter((u) => u !== url);
            if (state.serverUrl === url) state.serverUrl = null;
            renderConnect();
          });
          list.appendChild(item);
        }
      }

      /** 先确认服务器可达（no-cors 请求只要能建立连接就会成功），再交给壳导航 */
      async function probe(url) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 6000);
        try {
          await fetch(url + "/manifest.webmanifest", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
          return true;
        } catch {
          return false;
        } finally {
          clearTimeout(timer);
        }
      }

      async function connect(raw, fromAuto) {
        const url = normalizeUrl(raw || "");
        if (!url) {
          show("connect");
          setMsg("connect-msg", "请输入有效的服务器地址", true);
          return;
        }
        if (fromAuto) {
          $("progress-title").textContent = "正在连接 " + hostOf(url) + "…";
          $("progress-hint").textContent = "";
          $("progress-cancel").textContent = "更换服务器";
          show("progress");
        } else {
          setMsg("connect-msg", "正在连接 " + hostOf(url) + "…");
          $("connect-btn").disabled = true;
        }
        try {
          if (!(await probe(url))) {
            show("connect");
            $("url-input").value = url;
            setMsg("connect-msg", "无法连接到 " + hostOf(url) + "，请确认地址正确、服务器已启动，且两台电脑在同一网络", true);
            return;
          }
          const result = await invoke("connect_server", { url });
          if (result === "restart") {
            $("progress-title").textContent = "正在重启客户端…";
            $("progress-hint").textContent = "首次连接该局域网地址，需要重启以启用音视频通话等功能";
            $("progress-cancel").hidden = true;
            show("progress");
          }
        } catch (e) {
          show("connect");
          setMsg("connect-msg", String(e), true);
        } finally {
          $("connect-btn").disabled = false;
        }
      }

      $("connect-form").addEventListener("submit", (e) => {
        e.preventDefault();
        connect($("url-input").value);
      });

      $("progress-cancel").addEventListener("click", () => {
        autoEnter = false;
        show(state.mode === "client" ? "connect" : "server");
      });

      // ── 初始化 ──
      async function init() {
        syncMaximized();
        state = await invoke("launcher_state");
        fillServerForm();
        renderServer();

        if (state.intent === "settings") return show("server");
        if (state.intent !== "auto") return show("home");

        if (state.mode === "server") {
          if (state.server.status === "error") return show("server");
          autoEnter = true;
          $("progress-title").textContent = "正在启动本机服务…";
          $("progress-hint").textContent = "首次启动需要初始化数据库，请稍候";
          $("progress-cancel").textContent = "服务器设置";
          show("progress");
          startPolling();
          return;
        }
        if (state.mode === "client" && state.serverUrl) return connect(state.serverUrl, true);
        show("home");
      }

      init().catch((e) => {
        document.querySelector("main").innerHTML = '<div class="error-box">启动页初始化失败：' + String(e) + "</div>";
      });
    </script>
  </body>
</html>

[package]
name = "oa-desktop"
version = "0.1.0"
description = "Tauri v2 desktop wrapper for 协作平台 OA"
authors = ["OA Team"]
edition = "2021"

[lib]
name = "oa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

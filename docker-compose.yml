# 可选依赖：多实例实时总线（Redis）与未来迁移 PostgreSQL。
# 默认开发不需要启动本文件；数据库仍是 SQLite，REDIS_URL 不设置时实时服务为单实例模式。
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: oa
      POSTGRES_DB: oa
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  redis-data:
  pg-data:

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>无法连接服务器</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f7f7f5; color: #37352f; font: 15px/1.5 system-ui, "PingFang SC", sans-serif; padding: 24px; box-sizing: border-box; }
      main { max-width: 420px; width: 100%; text-align: center; }
      .icon { width: 52px; height: 52px; border-radius: 50%; background: #fdecec; color: #e03e3e; font-size: 26px; display: grid; place-items: center; margin: 0 auto 16px; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { color: #6b6a65; margin: 0 0 6px; font-size: 13.5px; word-break: break-all; }
      .btn { display: block; width: 100%; height: 44px; margin-top: 12px; border-radius: 10px; border: 1px solid #d9d9d6; background: #fff; font: inherit; color: #37352f; }
      .btn.primary { background: #2383e2; border-color: #2383e2; color: #fff; font-weight: 600; margin-top: 24px; }
      .btn:disabled { opacity: 0.6; }
      .hint { color: #9b9a97; font-size: 12.5px; margin-top: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">!</div>
      <h1 id="title">无法连接到 OA 服务器</h1>
      <p id="server"></p>
      <p id="reason"></p>
      <button class="btn primary" id="retry" type="button">重试</button>
      <button class="btn" id="launcher" type="button">切换服务器</button>
      <p class="hint">服务器地址换了（例如换了 IP 或端口）？点「切换服务器」重新填写。</p>
    </main>
    <script>
      const native = window.OAShellNative;
      const reasons = { network: "网络不可达或服务器未启动", ssl: "服务器证书不受信任", http: "服务器暂时不可用", timeout: "服务器长时间没有响应，可能已关机、地址已更换或网络不通" };

      function render(info) {
        document.getElementById("server").textContent = info.serverUrl ? "服务器：" + info.serverUrl : "";
        if (info.kind === "timeout") {
          document.getElementById("title").textContent = "连接 OA 服务器超时";
          document.title = "连接服务器超时";
        }
        document.getElementById("reason").textContent = (reasons[info.kind] || "") + (info.reason ? "（" + info.reason + "）" : "");
      }

      // 原生层要等 onPageStarted 记下本页地址后才回答 info()（只对包内页面开放），页面脚本可能先跑到这里，短暂重试
      function loadInfo(tries) {
        let info = {};
        try { info = JSON.parse(native ? native.info() : "{}"); } catch {}
        if (native && !info.serverUrl && tries > 0) return setTimeout(() => loadInfo(tries - 1), 100);
        render(info);
      }
      loadInfo(30);

      document.getElementById("retry").addEventListener("click", (e) => {
        if (!native) return;
        e.currentTarget.disabled = true;
        e.currentTarget.textContent = "正在重试…";
        native.retry();
      });
      document.getElementById("launcher").addEventListener("click", () => native && native.openLauncher());
    </script>
  </body>
</html>
